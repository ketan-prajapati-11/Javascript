<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OTP - Verification</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="card">
        <form class="otp-form">
            <div class="display-otp">
                111111
            </div>
            <div class="timer">
                <div class="timer-digit">00:30</div>
                <div class="timer-bar">
                    <div class="progress-bar" style="--progress: 0%;"></div>
                </div>
            </div>
            <div class="status">
                <div class="hidden verified">
                    Verified OTP
                </div>
                <div class="hidden non-verified">
                    Fail to Verify: Try again
                </div>
            </div>

               <input
                type="text"
                id="inp-otp"
                inputmode="numeric"
                pattern="[0-9]*"
                placeholder="Enter OTP"
                maxlength="6"
                minlength="6"
                
                required
            >

            <div class="attempts">
                <span class="left-attempt">3</span> attempts left &middot;
                <button type="button" class="link-btn resend-otp">Resend OTP</button>
            </div>
            <div class="btns">
                <button class="btn generate-otp" type="button">Generate OTP</button>
                <button class="btn verify" type="submit">Verify</button>
            </div>
        </form>
    </div>

    <script src="script.js"></script>
</body>

</html>
