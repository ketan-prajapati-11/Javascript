<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home | Meal Recipe</title>
    <link rel="stylesheet" href="login.css">
    <link rel="stylesheet" href="home.css">
</head>

<body>

    <header class="header_section">
        <!-- <div class="hero-img"></div> -->
        <div class="logo">
            <div class="logo_Img">
                <img src="images/logo.svg" alt="">
            </div>
            <div class="logo_name">Meal Recipe</div>
        </div>

        <ul class="nav_menu" id="nav-menu">
            <li class="home_menu active"><a href="#">Home</a></li>
            <li class="Recipe_menu"><a href="recipe.html">Recipe</a></li>
            <li class="fevorite_menu"><a href="/food_receipe/favorites.html">Favorites</a></li>
        </ul>

        <div class="right-menu">
            <button class="theme-toggle" type="button" aria-label="Toggle dark mode" aria-pressed="false">
                <span class="theme-toggle-track">
                    <span class="theme-toggle-thumb">
                        <img class="icon icon-sun" src="images/sun-solid-full.svg" alt="" aria-hidden="true" />
                        <img class="icon icon-moon" src="images/moon-solid-full.svg" alt="" aria-hidden="true" />
                    </span>
                </span>
            </button>

            <div class="profile-wrap">
                <button class="profile" id="profile-btn" type="button" aria-haspopup="true" aria-expanded="false">
                    <span class="profile-text" id="profile-name"></span>
                    <span class="avatar" id="avatar"></span>
                </button>
                <div class="profile-menu" id="profile-menu" hidden>
                    <p class="profile-email" id="profile-email"></p>
                    <button type="button" class="logout-btn" id="logout-btn">Log out</button>
                </div>
            </div>

              <!-- <a class="profile" href="profile.html" aria-label="Open my profile">
                <span class="profile-text" id="profile-name"></span>
                <span class="avatar" id="avatar"></span>
            </a> -->

            <button class="menu-toggle" id="menu-toggle" type="button" aria-label="Open menu" aria-expanded="false"
                aria-controls="nav-menu">
                <span></span><span></span><span></span>
            </button>
        </div>
    </header>

    <main>
        <section class="hero">
            <h1>What are we cooking today?</h1>
            <p>Search by name, pick a category or something you have to try to make.</p>

            <form class="search" id="search-form" role="search">
                <input type="text" id="search-bar" placeholder="Search recipes..." autocomplete="off" aria-label="Search recipes">
                <button type="button" class="search-clear" id="search-clear" aria-label="Clear search" hidden>&times;</button>
                <button type="submit" class="search-btn">Search</button>
            </form>
        </section>

        <section class="categories">
            <div class="section-head">
                <h2 class="section-title">Categories</h2>
                <div class="cat-controls">
                    <div class="cat-nav" id="cat-nav">
                        <button type="button" class="icon-btn" id="cat-prev" aria-label="Scroll categories left">&lsaquo;</button>
                        <button type="button" class="icon-btn" id="cat-next" aria-label="Scroll categories right">&rsaquo;</button>
                    </div>
                    <button type="button" class="pill-btn" id="view-all" aria-expanded="false">View all</button>
                </div>
            </div>
            <ul class="category-container" id="category-container"></ul>
        </section>

        <section class="recipes">
            <div class="section-head">
                <h2 class="section-title" id="section-title">Explore Recipes</h2>
                <button type="button" class="pill-btn vanish" c id="reset-btn">Shuffle recipes</button>
            </div>
            <p class="status" id="status" role="status" hidden></p>
            <div class="racipe-container" id="recipe-container"></div>
        </section>
    </main>

    <script src="home.js"></script>
</body>

</html>
