<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recipe | Meal Recipe</title>
    <link rel="stylesheet" href="login.css">
    <link rel="stylesheet" href="home.css">
    <link rel="stylesheet" href="recipe.css">
</head>

<body>

    <header class="header_section">
        <div class="logo">
            <div class="logo_Img">
                <img src="images/logo.svg" alt="">
            </div>
            <div class="logo_name">Meal Recipe</div>
        </div>

        <ul class="nav_menu" id="nav-menu">
            <li class="home_menu"><a href="home.html">Home</a></li>
            <li class="Recipe_menu active"><a href="recipe.html" aria-current="page">Recipe</a></li>
            <li class="fevorite_menu"><a href="favorites.html">Favorites</a></li>
        </ul>

        <div class="right-menu">
            <button class="theme-toggle" type="button" aria-label="Toggle dark mode" aria-pressed="false">
                <span class="theme-toggle-track">
                    <span class="theme-toggle-thumb">
                        <img class="icon icon-sun" src="images/sun-solid-full.svg" alt="" aria-hidden="true" />
                        <img class="icon icon-moon" src="images/moon-solid-full.svg" alt="" aria-hidden="true" />
                    </span>
                </span>
            </button>

            <a class="profile" href="profile.html" aria-label="Open my profile">
                <span class="profile-text" id="profile-name"></span>
                <span class="avatar" id="avatar"></span>
            </a>

            <button class="menu-toggle" id="menu-toggle" type="button" aria-label="Open menu" aria-expanded="false"
                aria-controls="nav-menu">
                <span></span><span></span><span></span>
            </button>
        </div>
    </header>

    <main class="recipe-page">

        <!-- back (left) and favorite (right) -->
        <div class="btns">
            <a class="action-btn  back-btn hidebtn" href="home.html">&larr; Back to home</a>
            <button class="action-btn favorite-btn" id="fav-btn" type="button" aria-pressed="false" disabled>
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" />
                </svg>
                <span id="fav-label">Add to favorites</span>
            </button>
        </div>

        <!-- loading placeholder -->
        <div class="recipe-top skeleton" style="display: none;" id="loading" aria-hidden="true">
            <div class="food-img"></div>
            <div class="sk-stack">
                <div class="sk-line short"></div>
                <div class="sk-line"></div>
                <div class="sk-line"></div>
            </div>
        </div>

        <!-- error / not found -->
        <div class="recipe-error" " id="error" role="alert" hidden>
            <h2 id="error-title"></h2>
            <p id="error-text"></p>
            <div class="error-actions">
                <button type="button" class="pill-btn" id="retry-btn">Try again</button>
                <a class="pill-btn" href="home.html">Back to home</a>
            </div>
        </div>

        <!-- the recipe -->
        <article class="recipe-card" id="recipe-card" hidden>
            <div class="recipe-top">
                <div class="recipe-img">
                    <img class="recipe-pic" id="recipe-pic" alt="">
                </div>
                <div class="recipe-summary">
                    <ul class="category" id="tags"></ul>
                    <h1 class="recipe-name" id="recipe-name"></h1>
                    <p class="recipe-facts" id="facts"></p>
                    <div class="recipe-links" id="links"></div>
                </div>
            </div>

            <section class="recipe-section" id="ingredients-section">
                <h2 class="section-title">Ingredients</h2>
                <ul class="ingredients-container" id="ingredients"></ul>
            </section>

            <section class="recipe-section recipe" id="steps-section">
                <h2 class="section-title">Instructions</h2>
                <ol class="steps" id="steps"></ol>
            </section>
        </article>

    </main>

    <script src="recipe.js"></script>
</body>

</html>
