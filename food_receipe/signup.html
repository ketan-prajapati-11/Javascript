<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="login.css">
    <link rel="stylesheet" href="signup.css">

</head>

<body>

    <head>
        <div class="header_section">
            <div class="logo">
                <div class="logo_Img">
                    <img src="images/logo.svg" alt="" srcset="">
                </div>
                <div class="logo_name">
                    Meal Recipe
                </div>
            </div>

            <div>
                <button class="theme-toggle" type="button" aria-label="Toggle dark mode" aria-pressed="false">
                    <span class="theme-toggle-track">
                        <span class="theme-toggle-thumb">
                            <img class="icon icon-sun" src="images/sun-solid-full.svg" alt="" aria-hidden="true" />
                            <img class="icon icon-moon" src="images/moon-solid-full.svg" alt="" aria-hidden="true" />
                        </span>
                    </span>
                </button>
            </div>

        </div>
    </head>

    <main>

        <div class="card">
            <div class="left-img">
                <img src="images/signup_image.jpeg" alt="" srcset="">

            </div>
            <div class="right_form">

                <h3> Sign Up</h3>
                <form action="">
                    <label for="username" id="username">User name</label>
                    <input type="text" id="username" placeholder="Enter your name">
                    
                    <label for="useremail" id="useremail"> Email</label>
                    <input type="email" id="email" placeholder="Enter your Email">

                    <label for="password">Password</label>
                    <input type="password" name="password" id="password" placeholder="Enter your password">
                    <div class="btn">
                        <button type="submit" class="submit-btn">Login</button>
                    </div>
                    <div class="newUser">Have an account? <a href="">click here</a> to Login</div> 
                </form>
            </div>
        </div>

    </main>


    <script src="login.js"></script>
    <script src="signup.js"></script>
</body>

</html>
