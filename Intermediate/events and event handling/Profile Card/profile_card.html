    <meta charset="UTF-8" />

    <title>Document</title>
    <style>
      body,
      .main, .form_area , .cards{
        height: 100%;
        width: 100%;
        background-color: #212121;
        margin: 10px;
      }
      form {
        display: flex;
        flex-direction: column;
        /* display: inline-block; */
        display: inline-flex;
        gap: 2px;
        margin-bottom: 40px;
        width: 100;
      }
      .cards{
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
      }
      
      .card {
        color: white;
        max-width: 300px;
        border: 1px solid #4a4848;
        border-radius: 7px;
        padding: 20px;
        display: inline-block;
      }
      .profile-pic {
        height: 50px;
        width: 50px;
        border-radius: 50%;
        overflow: hidden;
        background-color: blue;
      }
      .profile-pic img {
        object-fit: cover;
        height: 100%;
        width: 100%;
      }
      .card .name h3 {
        margin: 10px auto;
        font-size: 22px;
      }
      .card .occupation h5 {
        margin: 10px auto;
        font-size: 18px;
      }
      .summry{
        width: 100%;
      }
      p{
            text-overflow: ellipsis;
    overflow: hidden;
      }
    </style>
  </head>
  <body>
    <div class="main">
     <div class="form_area">
       <form>
         <input type="text" placeholder="Profile-pic" />
        <input type="text" placeholder="Name" />
        <input type="text" placeholder="occupation" />
        <input type="text" placeholder="Bio" />
        <input type="submit" value="submit" />
      </form>
     </div>
