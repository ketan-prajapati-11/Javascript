<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<link rel="stylesheet" href="style.css">
<body>
    
  <header class="navbar">
    <div class="brand">
      <img class="brand-logo" src="assets/images/bulb.svg" alt="" />
      <span class="brand-name">Quiz Mentor</span>
    </div>

    <button class="theme-toggle" type="button" aria-label="Toggle dark mode" aria-pressed="false">
      <span class="theme-toggle-track">
        <span class="theme-toggle-thumb">
          <img class="icon icon-sun" src="assets/images/sun-solid-full.svg" alt="" />

          <img class="icon icon-moon" aria-label="Switch to dark mode" aria-hidden="true"
            src="assets/images/moon-solid-full.svg" alt="" />
        </span>
      </span>
    </button>
  </header>



<script src="script.js"></script>
</body>
</html>
