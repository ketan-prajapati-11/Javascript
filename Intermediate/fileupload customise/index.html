<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    *{
        margin: 0;
        padding: 0;
    }
    body{
        height: 100vh;
        width: 100vw;
        background-color: #212121;
    }
    .main{
        height: 100%;
        width: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
    }
    input{
        display: none;
    }
    .btn{
        color: white;
        background-color: rgb(73, 133, 73);
        font-weight: 500;
        border-radius: 10px;
        padding: 10px 20px;
        font-size: 28px;
        /* justify-content: center;
        display: flex;
        align-items: center; */
        border: none;
    }
    .btn:hover{
        background-color: rgb(6, 66, 6);
        cursor: pointer;
        transform: scale(1.05);
       
    }
</style>
<body>
    <div class="main">
        <input class="inpfile" type="file">
        <button class="btn">Upload File</button>
    </div>
    <script src="script.js"></script>
</body>
</html>
